<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="每日经营汇报生成工具" />
    <title>每日经营汇报生成工具</title>
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">DAILY BUSINESS REPORT</p>
          <h1>每日经营汇报生成工具</h1>
          <p class="subtitle">填写数据，自动生成可直接发送至微信群的经营日报。</p>
        </div>
        <button id="newDayButton" class="button button-secondary" type="button">新一天</button>
      </header>

      <div class="workspace">
        <section class="form-panel" aria-label="经营数据录入">
          <form id="reportForm">
            <section class="form-card">
              <div class="card-heading"><span>01</span><h2>存款</h2></div>
              <div class="input-grid two-columns">
                <label>公司存款（万）<input data-field="companyDeposit" type="number" inputmode="decimal" step="any" value="0" /></label>
                <label>个人存款（万）<input data-field="personalDeposit" type="number" inputmode="decimal" step="any" value="0" /></label>
              </div>
              <p class="calculation">当日存款 <strong id="depositTotal">0</strong> 万</p>
            </section>

            <section class="form-card">
              <div class="card-heading"><span>02</span><h2>全量</h2></div>
              <div class="input-grid two-columns">
                <label>公司全量（万）<input data-field="companyVolume" type="number" inputmode="decimal" step="any" value="0" /></label>
                <label>个人全量（万）<input data-field="personalVolume" type="number" inputmode="decimal" step="any" value="0" /></label>
              </div>
              <p class="calculation">当日全量 <strong id="volumeTotal">0</strong> 万</p>
            </section>

            <section class="form-card">
              <div class="card-heading"><span>03</span><h2>贷款</h2></div>
              <div class="input-grid three-columns">
                <label>非房金额（万）<input data-field="nonMortgageAmount" type="number" inputmode="decimal" step="any" value="0" /></label>
                <label>收件笔数<input data-field="nonMortgageCases" type="number" inputmode="numeric" step="1" value="0" /></label>
                <label>收件金额（万）<input data-field="nonMortgageCaseAmount" type="number" inputmode="decimal" step="any" value="0" /></label>
                <label>批额户数<input data-field="approvedHouseholds" type="number" inputmode="numeric" step="1" value="0" /></label>
                <label>房贷金额（万）<input data-field="mortgageAmount" type="number" inputmode="decimal" step="any" value="0" /></label>
                <label>房贷收件笔数<input data-field="mortgageCases" type="number" inputmode="numeric" step="1" value="0" /></label>
                <label>公司贷款金额（万）<input data-field="corporateLoanAmount" type="number" inputmode="decimal" step="any" value="0" /></label>
              </div>
            </section>

            <section class="form-card">
              <div class="card-heading"><span>04</span><h2>普惠</h2></div>
              <p class="group-label">新增</p>
              <div class="input-grid three-columns">
                <label>总新增金额（万）<input data-field="inclusiveNewTotal" type="number" inputmode="decimal" step="any" value="0" /></label>
                <label>公司金额（万）<input data-field="inclusiveNewCompany" type="number" inputmode="decimal" step="any" value="0" /></label>
                <label>个人金额（万）<input data-field="inclusiveNewPersonal" type="number" inputmode="decimal" step="any" value="0" /></label>
              </div>
              <p class="group-label">客户</p>
              <div class="input-grid three-columns">
                <label>客户总数（户）<input data-field="inclusiveCustomersTotal" type="number" inputmode="numeric" step="1" value="0" /></label>
                <label>公司客户（户）<input data-field="inclusiveCustomersCompany" type="number" inputmode="numeric" step="1" value="0" /></label>
                <label>个人客户（户）<input data-field="inclusiveCustomersPersonal" type="number" inputmode="numeric" step="1" value="0" /></label>
              </div>
              <p class="group-label">收件</p>
              <div class="input-grid two-columns">
                <label>收件笔数<input data-field="inclusiveCases" type="number" inputmode="numeric" step="1" value="0" /></label>
                <label>收件金额（万）<input data-field="inclusiveCaseAmount" type="number" inputmode="decimal" step="any" value="0" /></label>
              </div>
            </section>

            <section class="form-card">
              <div class="card-heading"><span>05</span><h2>代发薪</h2></div>
              <label>完成情况<input data-field="payroll" type="text" placeholder="例如：0/4" value="0/0" /></label>
            </section>

            <section class="form-card">
              <div class="card-heading"><span>06</span><h2>中收及客群</h2></div>
              <p class="group-label">五大投资类（万）</p>
              <div class="input-grid three-columns">
                <label>理财<input data-field="wealthManagement" type="number" inputmode="decimal" step="any" value="0" /></label>
                <label>私行代销<input data-field="privateBankSales" type="number" inputmode="decimal" step="any" value="0" /></label>
                <label>基金<input data-field="fund" type="number" inputmode="decimal" step="any" value="0" /></label>
                <label>保险趸交<input data-field="insurance" type="number" inputmode="decimal" step="any" value="0" /></label>
                <label>贵金属<input data-field="preciousMetals" type="number" inputmode="decimal" step="any" value="0" /></label>
              </div>
              <p class="group-label">客户</p>
              <div class="input-grid three-columns">
                <label>信用卡（户）<input data-field="creditCard" type="number" inputmode="numeric" step="1" value="0" /></label>
                <label>三方（户）<input data-field="thirdParty" type="number" inputmode="numeric" step="1" value="0" /></label>
                <label>一类卡（张）<input data-field="firstClassCard" type="number" inputmode="numeric" step="1" value="0" /></label>
              </div>
            </section>

            <section class="form-card">
              <div class="card-heading"><span>07</span><h2>走访情况</h2></div>
              <label>走访内容<textarea data-field="visits" rows="4" placeholder="例如：鑫忠印染 商会客户1户"></textarea></label>
            </section>
          </form>
        </section>

        <aside class="preview-panel" aria-label="日报预览">
          <div class="preview-head">
            <div><p class="eyebrow">REPORT PREVIEW</p><h2>日报预览</h2></div>
            <span id="saveStatus" class="save-status">已自动保存</span>
          </div>
          <pre id="reportPreview" class="report-preview" aria-live="polite"></pre>
          <div class="action-buttons">
            <button id="generateButton" class="button button-primary" type="button">生成日报</button>
            <button id="copyButton" class="button button-dark" type="button">复制到微信</button>
            <button id="exportButton" class="button button-outline" type="button">导出日报 TXT</button>
          </div>
          <p id="actionMessage" class="action-message" role="status"></p>
        </aside>
      </div>
    </main>
    <script src="site.js"></script>
    <script src="mobile.js"></script>
  </body>
</html>
